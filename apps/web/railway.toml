# Railway service config for the Next.js frontend.
# Railway auto-detects Next.js via Nixpacks; we just specify start command + healthcheck.

[build]
builder = "nixpacks"

[deploy]
startCommand = "npm start"
healthcheckPath = "/"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
